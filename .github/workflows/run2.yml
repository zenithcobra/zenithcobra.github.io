name: Run2 - get_streaks get_standings todays_schedule match_overviews teams_today_list process_bvp process_streaks make_index

on:
  schedule:
  - cron: "0 10 * * *"  # Runs at 10 utc = 6am est

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v2  # Checkout the repository content to the GitHub runner

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.12.1  # Specify the Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run the Python script
        run: |
          python script2_get_streaks.py
          python script6_get_standings.py
          python script4_todays_schedule.py
          python script5_match_overviews.py
          python script7_teams_today_list.py
          python script8_process_bvp.py
          python script9_process_streaks.py
          python script10_make_index.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Automated commit by GitHub Actions"
          git push