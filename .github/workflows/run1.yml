name: Run1 - matches_today yesterdays_report get_standings todays_schedule match_overviews teams_today_list process_bvp make_index

on:
  schedule:
    - cron: "45 5,12,17,18,20 * * *"  # Runs at 5:45 AM, 12:45 PM, 5:45 PM, and 6:45 PM UTC
jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v2  # Checkout the repository content to the GitHub runner

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.12.1  # Specify the Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run the Python script
        run: |
          # python run_script.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Automated commit by GitHub Actions"
          git push